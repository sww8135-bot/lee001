<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เครื่องคำนวณส่วนลด</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px 28px;
    width: 340px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 24px 0;
    text-align: center;
    color: #f8fafc;
  }
  label {
    display: block;
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #38bdf8; }
  .result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    background: #0f172a;
    border: 1px solid #334155;
    text-align: center;
  }
  .result .price {
    font-size: 28px;
    font-weight: 700;
    color: #4ade80;
  }
  .result .save {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
  }
  .result .old {
    font-size: 13px;
    color: #64748b;
    text-decoration: line-through;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💰 เครื่องคำนวณส่วนลด</h1>

    <div class="field">
      <label for="price">ราคาปกติ (บาท)</label>
      <input type="number" id="price" placeholder="เช่น 1000" inputmode="decimal">
    </div>

    <div class="field">
      <label for="percent">ส่วนลด (%)</label>
      <input type="number" id="percent" placeholder="เช่น 20" inputmode="decimal">
    </div>

    <div class="result">
      <div class="old" id="oldPrice"></div>
      <div class="price" id="finalPrice">฿0.00</div>
      <div class="save" id="saveAmount">ประหยัด ฿0.00</div>
    </div>
  </div>

<script>
  const priceInput = document.getElementById('price');
  const percentInput = document.getElementById('percent');
  const finalPrice = document.getElementById('finalPrice');
  const saveAmount = document.getElementById('saveAmount');
  const oldPrice = document.getElementById('oldPrice');

  function formatMoney(num) {
    return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calculate() {
    const price = parseFloat(priceInput.value) || 0;
    const percent = parseFloat(percentInput.value) || 0;

    const discountValue = price * (percent / 100);
    const result = price - discountValue;

    finalPrice.textContent = '฿' + formatMoney(result);
    saveAmount.textContent = 'ประหยัด ฿' + formatMoney(discountValue);
    oldPrice.textContent = price > 0 ? 'ราคาปกติ ฿' + formatMoney(price) : '';
  }

  priceInput.addEventListener('input', calculate);
  percentInput.addEventListener('input', calculate);

  calculate();
</script>
</body>
</html>
